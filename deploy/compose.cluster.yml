# Two Pimpbase servers on one Postgres, sharing a files folder, behind
# Caddy as the load balancer.
#
#   docker compose -f deploy/compose.cluster.yml up -d --build
#   open http://localhost:8080
#
# Scale out with:  docker compose -f deploy/compose.cluster.yml up -d --scale pimpbase=4
#
# Scheduled flows run once per minute across all servers (each run is
# claimed in Postgres); uploads go to the shared volume. For files in S3
# instead, set PIMPBASE_FILES=s3://bucket/prefix?region=… and the AWS_*
# keys, and drop the files volume.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pimpbase
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: pimpbase
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pimpbase"]
      interval: 5s
      retries: 20

  pimpbase:
    build: ..
    image: pimpbase:latest
    restart: unless-stopped
    deploy:
      replicas: 2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PIMPBASE_POSTGRES: postgres://pimpbase:change-me@postgres:5432/pimpbase?sslmode=disable
      PIMPBASE_FILES: dir:/files
      PIMPBASE_BEHIND_PROXY: "true"
      # Fail /readyz for 10s before stopping, so Caddy moves traffic away.
      PIMPBASE_DRAIN: 10s
      # Per server; with N servers a client gets up to N times this.
      PIMPBASE_RATE_LIMIT: ${PIMPBASE_RATE_LIMIT:-100}
      # PIMPBASE_METRICS_TOKEN: change-me-too
      # PIMPBASE_PUBLIC_URL: https://apps.example.com
      # PIMPBASE_SECURE_COOKIES: "true"
    volumes:
      - files:/files
    stop_grace_period: 40s

  lb:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - pimpbase
    ports:
      - "${PIMPBASE_PORT:-8080}:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  pg:
  files:
